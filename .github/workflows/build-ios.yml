name: Build & Release iOS IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App Binary (Unsigned)
        run: |
          cd ios
          xcodebuild clean build \
            -workspace Athleo.xcworkspace \
            -scheme Athleo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Athleo.app Payload/
          zip -r Athleo.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athleo-iOS-IPA
          path: Athleo.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-b${{ github.run_number }}
          name: "Athleo iOS v1.0.0 (Release Build #${{ github.run_number }})"
          body: |
            ### 🚀 Athleo iOS Release for Sideloadly
            - **Build**: #${{ github.run_number }}
            - **File**: `Athleo.ipa`
            - **Installation**: Download `Athleo.ipa` below and open with **Sideloadly** on your PC.
            - **Changes**: New 3D generated visual assets, cyber runner hero banner, biometric passkey integration, and enhanced dark UI.
          files: Athleo.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
